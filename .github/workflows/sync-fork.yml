name: Sync Fork

on:
  schedule:
    # 每天 UTC 0:00（北京时间 08:00）自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动点击按钮触发

permissions:
  contents: write # 赋予写入仓库权限

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Fork via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 自动同步当前仓库的 main 分支（若主分支是 master 请更换为 -b master）
          gh repo sync ${{ github.repository }} -b main
